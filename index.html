<style>

  #card p{margin:6px 0;line-height:1.4;font-size:15px;color:#c3cfdc}
  #card .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  #card button{flex:1;font:700 17px system-ui,sans-serif;padding:14px;border-radius:12px;border:0;cursor:pointer}
  #goVR{background:#4f8cff;color:#fff}
  #goFlat{background:#2f9e5a;color:#fff}
  #msg{margin-top:12px;color:#ffcf7a;font-size:14px;line-height:1.4}
  #piano{position:fixed;left:0;right:0;bottom:0;height:38%;background:#1c1c22;display:none;z-index:4;padding:34px 6px 8px;box-sizing:border-box;touch-action:none}
  #piano .wk{position:relative;display:inline-block;height:100%;background:#fafafa;border:1px solid #888;border-radius:0 0 6px 6px;box-sizing:border-box}
  #piano .bk{position:absolute;top:34px;height:58%;background:#222;border-radius:0 0 4px 4px;z-index:2}
  #piano .on{background:#9fd3ff !important}
  #piano #pclose{position:absolute;right:8px;top:4px;font:700 14px system-ui;color:#fff;background:#444;border:0;border-radius:8px;padding:5px 12px}
  #piano #ptitle{position:absolute;left:12px;top:8px;color:#ccc;font:600 13px system-ui}
</style>

<body>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
const MODE = 'vr';
const V3 = THREE.Vector3, QT = THREE.Quaternion;
const cv = v => new CANNON.Vec3(v.x, v.y, v.z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MODE === 'vr' ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 150);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
camera.position.set(0, 1.6, 0);
camera.layers.enable(3);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.0));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.8); sun.position.set(5, 10, 7); scene.add(sun);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------------- physics ---------------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 12;
const defMat = world.defaultMaterial;
world.defaultContactMaterial.friction = 0.45;
world.defaultContactMaterial.restitution = 0.12;
const bouncyMat = new CANNON.Material('bouncy');
world.addContactMaterial(new CANNON.ContactMaterial(bouncyMat, defMat, { friction: 0.4, restitution: 0.75 }));

const G_STATIC = 1, G_MOVER = 2, G_FREE = 4, G_HAND = 8;
const FREE_MASK = G_STATIC | G_MOVER | G_FREE | G_HAND;
const anchor = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC }); world.addBody(anchor);

/* ---------------- helpers ---------------- */
const BOX = new THREE.BoxGeometry(1, 1, 1), SPH = new THREE.SphereGeometry(1, 18, 12), CYL = new THREE.CylinderGeometry(1, 1, 1, 18);
const matCache = {};
const mat = c => (typeof c === 'number' ? (matCache[c] ||= new THREE.MeshLambertMaterial({ color: c })) : c);
function mesh(geo, sx, sy, sz, c) { const o = new THREE.Mesh(geo, mat(c)); o.scale.set(sx, sy, sz); return o; }
function vbox(x, y, z, sx, sy, sz, c, geo = BOX) { const m = mesh(geo, sx, sy, sz, c); m.position.set(x, y, z); scene.add(m); return m; }
const walkCols = [];
const addCol = (x0, x1, z0, z1) => walkCols.push([x0, x1, z0, z1]);
function sbox(x, y, z, sx, sy, sz, c, walk = true, geo = BOX) {
  const m = vbox(x, y, z, sx, sy, sz, c, geo);
  const b = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC, material: defMat, collisionFilterGroup: G_STATIC, collisionFilterMask: G_FREE });
  b.addShape(new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2))); b.position.set(x, y, z); world.addBody(b);
  if (walk && y - sy / 2 < 1.2 && y + sy / 2 > 0.25) addCol(x - sx / 2, x + sx / 2, z - sz / 2, z + sz / 2);
  return m;
}
// local frame for furniture: u = right-ish, f = facing (front), y = up
function F(cx, cz, facing) {
  const f = { px: [1, 0], nx: [-1, 0], pz: [0, 1], nz: [0, -1] }[facing];
  const u = [f[1], -f[0]];
  return {
    p: (a, b, c) => new V3(cx + u[0] * a + f[0] * c, b, cz + u[1] * a + f[1] * c),
    v: (a, b, c) => new V3(u[0] * a + f[0] * c, b, u[1] * a + f[1] * c),
    s: (su, sv, sw) => [Math.abs(u[0]) * su + Math.abs(f[0]) * sw, sv, Math.abs(u[1]) * su + Math.abs(f[1]) * sw],
    f: new V3(f[0], 0, f[1]), u: new V3(u[0], 0, u[1]),
  };
}

/* ---------------- sound ---------------- */
let actx = null;
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function tone(f, d = 0.08, type = 'square', v = 0.06, f2 = null) {
  if (!actx) return; const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v, freq, freq2) {
  if (!actx) return; const t = actx.currentTime, n = Math.floor(actx.sampleRate * d), buf = actx.createBuffer(1, n, actx.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(); s.buffer = buf; const fl = actx.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(freq, t); if (freq2) fl.frequency.exponentialRampToValueAtTime(freq2, t + d);
  const g = actx.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(actx.destination); s.start(t);
}
const sfx = {
  click: () => tone(1500, 0.03, 'square', 0.04),
  beep: () => tone(880, 0.12, 'sine', 0.09),
  ding: () => { tone(1568, 0.7, 'sine', 0.1); tone(2093, 0.5, 'sine', 0.04); },
  pop: () => tone(300, 0.12, 'triangle', 0.12, 900),
  flush: () => noise(1.8, 0.3, 1800, 200),
  thud: v => noise(0.07, Math.min(0.22, v * 0.03), 260),
  grab: () => tone(420, 0.04, 'triangle', 0.04),

let lastThud = 0;

/* ---------------- things (physics objects) ---------------- */
const bodyThing = new WeakMap();
const PERF = { on: false, cereal: 120, popcorn: 60 };
const things = [], cookables = [], hinges = [], sliders = [];
function newDynBody(mass, pos, group) {
  return new CANNON.Body({
    mass, material: defMat, position: cv(pos), collisionFilterGroup: group,
    collisionFilterMask: group === G_FREE ? FREE_MASK : (G_FREE | G_HAND),
    linearDamping: 0.05, angularDamping: 0.1, sleepSpeedLimit: 0.15, sleepTimeLimit: 0.8,

}
function regThing(t) {
  t.home = { p: t.body.position.clone(), q: t.body.quaternion.clone() };
  t.mesh.traverse(o => { o.userData.thing = t; });
  t.mesh.position.copy(t.body.position); t.mesh.quaternion.copy(t.body.quaternion);
  things.push(t); scene.add(t.mesh); world.addBody(t.body);
  bodyThing.set(t.body, t);
  if (!t.quiet) t.body.addEventListener('collide', e => {
    const iv = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const now = performance.now();
    if (t.onCollide) t.onCollide(e, iv);
    if (t.hitSound) { if (iv > 0.8 && now - (t.lastHit || 0) > 90) { t.lastHit = now; hitSfx[t.hitSound](iv); } return; }
    if (iv > 1.6 && now - lastThud > 60) { lastThud = now; sfx.thud(iv); }
  });

}
function compound(name, center, parts, mass, o = {}) {
  const b = newDynBody(mass, center, o.group || G_FREE);
  const g = new THREE.Group(); let hx = 0.01, hy = 0.01, hz = 0.01;
  for (const p of parts) {
    const off = p.p.isVector3 ? p.p : new V3(...p.p), s = p.s; let m;
    if (p.obj) { m = p.obj; m.position.copy(off); g.add(m); continue; }
    if (p.geo === 'ball') {
      if (!p.noShape) b.addShape(new CANNON.Sphere(s[0]), cv(off));
      m = mesh(SPH, s[0], s[0], s[0], p.c);
      hx = Math.max(hx, Math.abs(off.x) + s[0]); hy = Math.max(hy, Math.abs(off.y) + s[0]); hz = Math.max(hz, Math.abs(off.z) + s[0]);
    } else if (p.geo === 'cyl') {
      if (!p.noShape) b.addShape(new CANNON.Cylinder(s[0], s[0], s[1], 12), cv(off));
      m = mesh(CYL, s[0], s[1], s[0], p.c);
      hx = Math.max(hx, Math.abs(off.x) + s[0]); hy = Math.max(hy, Math.abs(off.y) + s[1] / 2); hz = Math.max(hz, Math.abs(off.z) + s[0]);
    } else {
      if (!p.noShape) b.addShape(new CANNON.Box(new CANNON.Vec3(s[0] / 2, s[1] / 2, s[2] / 2)), cv(off), p.ry ? new CANNON.Quaternion().setFromEuler(0, p.ry, 0) : undefined);
      m = mesh(BOX, s[0], s[1], s[2], p.c); if (p.ry) m.rotation.y = p.ry;
      if (!p.noShape) { hx = Math.max(hx, Math.abs(off.x) + s[0] / 2); hy = Math.max(hy, Math.abs(off.y) + s[1] / 2); hz = Math.max(hz, Math.abs(off.z) + s[2] / 2); }
    }
    if (p.rot) m.rotation.set(...p.rot);
    if (p.hidden) m.visible = false;
    m.position.copy(off); g.add(m);
  }
  const t = { name, body: b, mesh: g, half: new CANNON.Vec3(hx, hy, hz), kind: 'free', radius: 0, ...o };
  if (o.bouncy) b.material = bouncyMat;
  if (o.rotY) b.quaternion.setFromEuler(0, o.rotY, 0);
  if (o.rotX) b.quaternion.setFromEuler(o.rotX, o.rotY || 0, 0);
  if (o.cook) {
    t.cookMat = new THREE.MeshLambertMaterial({ color: o.cook[0] });
    g.children.forEach((c, i) => { if (i === 0 || parts[i]?.cookPart) c.traverse(m => { if (m.isMesh && !m.userData.keep) m.material = t.cookMat; }); }); t.cookLevel = o.cookLevel || 0; t.cookShown = -1;
    t.raw = new THREE.Color(o.cook[0]); t.done = new THREE.Color(o.cook[1]);

}
function compoundLocal(name, center, parts, fr, mass, col, group, o = {}) {
  const ps = parts.map(p => ({ p: fr.v(...p.o), s: fr.s(...p.s), c: p.c ?? col, noShape: p.noShape }));
  return compound(name, center, ps, mass, { group, ...o });
}
function item(name, kind, size, pos, col, mass, o = {}) {
  let part;
  if (kind === 'ball') part = { p: [0, 0, 0], s: [size], geo: 'ball', c: col };
  else if (kind === 'cyl') part = { p: [0, 0, 0], s: size, geo: 'cyl', c: col };
  else part = { p: [0, 0, 0], s: size, c: col };
  let extra = o.extra || [];
  if (o.vis) { part.hidden = true; extra = [...o.vis.map(v => ({ p: v.position.clone(), obj: v, cookPart: v.userData.cook })), ...extra]; }
  const t = compound(name, pos, [part, ...extra], mass, o);
  if (kind === 'ball') t.radius = size;
  return t;
}
function removeThing(t) {
  for (const g of grabbers) if (g.held === t) release(g);
  world.removeBody(t.body); scene.remove(t.mesh);
  things.splice(things.indexOf(t), 1);
  const ci = cookables.indexOf(t); if (ci >= 0) cookables.splice(ci, 1);
}

// hinged panel (doors, lids, cabinet doors)
function hinged(name, center, size, pivot, axisArr, openDir, maxA, col, o = {}) {
  const t = compound(name, center, [{ p: [0, 0, 0], s: size, c: col }], o.mass || 6, { group: G_MOVER });
  const b = t.body, ax = new CANNON.Vec3(...axisArr);
  b.angularFactor.set(Math.abs(ax.x), Math.abs(ax.y), Math.abs(ax.z));
  b.linearFactor.set(1 - Math.abs(ax.x), 1 - Math.abs(ax.y), 1 - Math.abs(ax.z));
  b.angularDamping = o.damp ?? 0.85; b.linearDamping = 0.5;
  const rel = new CANNON.Vec3(center.x - pivot.x, center.y - pivot.y, center.z - pivot.z);
  world.addConstraint(new CANNON.HingeConstraint(anchor, b, { pivotA: cv(pivot), axisA: ax, pivotB: new CANNON.Vec3(-rel.x, -rel.y, -rel.z), axisB: ax }));
  const qq = new CANNON.Quaternion().setFromAxisAngle(ax, 0.1), r2 = qq.vmult(rel);
  const sign = ((r2.x - rel.x) * openDir.x + (r2.y - rel.y) * openDir.y + (r2.z - rel.z) * openDir.z) > 0 ? 1 : -1;
  const h = { t, pivot: cv(pivot), axis: ax, rel, min: sign > 0 ? 0 : -maxA, max: sign > 0 ? maxA : 0, antiGrav: !!o.antiGrav, angle: 0 };
  t.kind = 'hinge'; t.hinge = h; hinges.push(h);
  if (o.handleLen !== 0) {
    const hl = o.handleLen || 0.12;
    const rv = new V3(rel.x, rel.y, rel.z), axv = new V3(ax.x, ax.y, ax.z);
    rv.sub(axv.clone().multiplyScalar(rv.dot(axv))); const dist = rv.length(); const far = rv.normalize();
    const thinI = size.indexOf(Math.min(...size)); const n = new V3(thinI === 0 ? 1 : 0, thinI === 1 ? 1 : 0, thinI === 2 ? 1 : 0);
    const hs = [0, 1, 2].map(i => Math.abs(axv.getComponent(i)) * hl + Math.abs(far.getComponent(i)) * 0.025 + Math.abs(n.getComponent(i)) * 0.03);
    for (const s of [1, -1]) {
      const off = far.clone().multiplyScalar(dist - 0.07).add(n.clone().multiplyScalar(s * (size[thinI] / 2 + 0.018)));
      const hm = mesh(BOX, hs[0], hs[1], hs[2], 0xc9ced4); hm.position.copy(off); hm.userData.thing = t; t.mesh.add(hm);

}
function makeSlider(t, axis, maxD) {
  const b = t.body;
  b.linearFactor.set(Math.abs(axis.x), Math.abs(axis.y), Math.abs(axis.z)); b.angularFactor.set(0, 0, 0);
  b.linearDamping = 0.6; t.kind = 'slide'; b.mass = 40; b.updateMassProperties(); // heavy, so stuff inside can't shove it around
  const sl = { t, start: b.position.clone(), axis: cv(axis), max: maxD }; t.slider = sl; sliders.push(sl);
}

/* ---------------- interactables ---------------- */
const interacts = [];
const proxyMat = new THREE.MeshBasicMaterial({ visible: false });
function interact(pos, size, name, use) {
  const m = new THREE.Mesh(BOX, proxyMat); m.scale.set(size, size, size); m.position.copy(pos); scene.add(m);
  const i = { name, pos: pos.clone(), r: size * 0.5, last: 0, poke: [false, false], mesh: m };
  i.use = () => { const n = performance.now(); if (n - i.last < 300) return; i.last = n; use(); };
  m.userData.interact = i; interacts.push(i); return i;
}

/* ---------------- colors ---------------- */
const WALL = 0xf1e9db, WOOD = 0xa87650, DARKWOOD = 0x5b3a26, WHITE = 0xf4f4f2, COUNTER = 0xdcd6cc, CAB = 0x7fa7c9,
  METAL = 0xb8bec4, BLACK = 0x222428, STEEL = 0x9aa1a8;

/* ---------------- house shell ---------------- */
const WH = 2.7, WT = 0.12, DOORH = 2.1;
function wallX(z, x0, x1, gaps = []) {
  let cur = x0;
  for (const [g0, g1] of gaps) {
    if (g0 > cur) sbox((cur + g0) / 2, WH / 2, z, g0 - cur, WH, WT, WALL);
    sbox((g0 + g1) / 2, (DOORH + WH) / 2, z, g1 - g0, WH - DOORH, WT, WALL, false);
    cur = g1;
  }
  if (x1 > cur) sbox((cur + x1) / 2, WH / 2, z, x1 - cur, WH, WT, WALL);
}
function wallZ(x, z0, z1, gaps = []) {
  let cur = z0;
  for (const [g0, g1] of gaps) {
    if (g0 > cur) sbox(x, WH / 2, (cur + g0) / 2, WT, WH, g0 - cur, WALL);
    sbox(x, (DOORH + WH) / 2, (g0 + g1) / 2, WT, WH - DOORH, g1 - g0, WALL, false);
    cur = g1;
  }
  if (z1 > cur) sbox(x, WH / 2, (cur + z1) / 2, WT, WH, z1 - cur, WALL);
}
// ground
sbox(0, -0.25, 0, 80, 0.5, 80, 0x6fae4f, false);
wallX(-5, -6.06, 6.06);
wallX(5, -6.06, 6.06, [[-3.5, -2.5]]);
wallZ(-6, -5, 5); wallZ(6, -5, 5);
wallX(0, -6, 6, [[-3.5, -2.5], [0.1, 0.95]]);
wallZ(0, -5, 0);
wallZ(1, 0, 5, [[1.8, 3.2]]);
function checkerTex(c1, c2, rep) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, 64, 64); x.fillStyle = c2; x.fillRect(0, 0, 32, 32); x.fillRect(32, 32, 32, 32);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}
vbox(-2.5, 0.005, 2.5, 7, 0.01, 5, 0xb48a5f);                       // living wood
